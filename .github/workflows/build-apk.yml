name: Build WargaKITA 15 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Siapkan Keystore & Build APK
        working-directory: android
        env:
          WK_KEYSTORE_B64: ${{ secrets.WK_KEYSTORE_BASE64 }}
          WK_KEYSTORE_PASS: ${{ secrets.WK_KEYSTORE_PASS }}
          WK_KEY_ALIAS: ${{ secrets.WK_KEY_ALIAS }}
          WK_KEY_PASS: ${{ secrets.WK_KEY_PASS }}
        run: |
          if [ -n "$WK_KEYSTORE_B64" ]; then
            echo "$WK_KEYSTORE_B64" | base64 -d > release.keystore
            export WK_KEYSTORE_PATH="$(pwd)/release.keystore"
            gradle assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../WargaKITA-15-v1.14.2.apk
          else
            gradle assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../WargaKITA-15-v1.14.2.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WargaKITA-15-v1.14.2-apk
          path: WargaKITA-15-v1.14.2.apk

      - name: Publikasikan ke GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.14.2-rt15' }}
          name: WargaKITA 15 (v1.14.2)
          files: WargaKITA-15-v1.14.2.apk
          make_latest: true
          body: |
            ## Rilis Awal WargaKITA 15 (`com.wargakita.rt15`)
            - Aplikasi terpisah khusus RT 15 (Ketua RT: Dwi Swandoko)
            - Terhubung ke database Supabase RT 15
