name: Build WargaKITA APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Siapkan Keystore, Build & Sign APK
        working-directory: android
        run: |
          if [ ! -f app/release.keystore ]; then
            keytool -genkey -v -keystore app/release.keystore -alias wargakita -keyalg RSA -keysize 2048 -validity 10000 -storepass wargakita15 -keypass wargakita15 -dname "CN=WargaKITA 15, OU=RT 15, O=Kebonagung, L=Malang, S=Jawa Timur, C=ID"
          fi
          chmod +x gradlew || true
          gradle wrapper --gradle-version 8.7 || true
          chmod +x gradlew
          ./gradlew assembleRelease

          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          BUILD_TOOLS=$(ls -d ${ANDROID_HOME}/build-tools/* | sort -V | tail -n 1)
          mkdir -p dist
          "$BUILD_TOOLS/zipalign" -v -p 4 "$UNSIGNED_APK" dist/aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks app/release.keystore --ks-key-alias wargakita --ks-pass pass:wargakita15 --key-pass pass:wargakita15 --out dist/WargaKITA-15-v1.15.2.apk dist/aligned.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WargaKITA-15-v1.15.2
          path: android/dist/WargaKITA-15-v1.15.2.apk

      - name: Publikasikan ke GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.15.2
          name: WargaKITA 15 v1.15.2
          body: |
            Pembaruan aplikasi WargaKITA 15 versi v1.15.2:
            - Sinkronisasi penuh fitur & tampilan terbaru
            - Perbaikan manajemen akun pengurus & developer
            - Peningkatan performa & kestabilan aplikasi
          files: android/dist/WargaKITA-15-v1.15.2.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
