name: Build WargaKITA APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Siapkan Keystore & Build APK
        working-directory: android
        run: |
          if [ ! -f app/release.keystore ]; then
            keytool -genkey -v -keystore app/release.keystore -alias wargakita -keyalg RSA -keysize 2048 -validity 10000 -storepass wargakita15 -keypass wargakita15 -dname "CN=WargaKITA 15, OU=RT 15, O=Kebonagung, L=Malang, S=Jawa Timur, C=ID"
          fi
          chmod +x gradlew || true
          gradle wrapper --gradle-version 8.7 || true
          chmod +x gradlew
          ./gradlew assembleRelease || ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WargaKITA-15-APK
          path: android/app/build/outputs/apk/**/*.apk

      - name: Publikasikan ke GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v-latest-rt15
          name: WargaKITA 15 Terbaru
          files: android/app/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
